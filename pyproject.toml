[project]
name = "constellation"
version = "0.1.0"
description = "An interactive map of a Claude Code setup"
readme = "README.md"
authors = [
    { name = "esharif20", email = "eshansharif2004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.19",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
local = [
    "fastembed>=0.9.1",
]
llm = [
    "anthropic>=2.4.0",
]

[project.scripts]
constellation = "constellation.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/constellation/redact.py", "src/constellation/cluster.py", "src/constellation/classify.py"]
pytest_add_cli_args_test_selection = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["fastembed", "anthropic"]
ignore_missing_imports = true
