[project]
name = "constellation-cli"
version = "0.1.0"
description = "An interactive map of a Claude Code setup"
readme = "README.md"
license = "MIT"
keywords = ["claude-code", "mcp", "skills", "graph", "context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
authors = [
    { name = "esharif20", email = "eshansharif2004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1,<3.1.3",
    "pyyaml>=6.0.3",
    "fastapi>=0.162.0",
    "mcp==2.3.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
local = [
    "fastembed>=0.9.1",
]
llm = [
    "anthropic>=2.4.0",
]
app = []  # kept so `constellation-cli[app]` and `uv sync --extra app` still resolve; the server is a base dependency now

[project.scripts]
constellation = "constellation.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "constellation"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.14",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = ["eval: slow quality check using the real local embedder or the real Anthropic model (spends money); run with `pytest -m eval -s`"]

[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/constellation/redact.py", "src/constellation/cluster.py", "src/constellation/classify.py", "src/constellation/env.py", "src/constellation/costs.py", "src/constellation/overlaps.py", "src/constellation/report.py", "src/constellation/suggestions.py", "src/constellation/hooks.py", "src/constellation/usage.py", "src/constellation/brief.py", "src/constellation/chat.py", "src/constellation/snapshot.py", "src/constellation/retrieve.py", "src/constellation/origins.py", "src/constellation/public_export.py", "src/constellation/diff.py", "src/constellation/history.py", "src/constellation/receipt.py", "src/constellation/answer.py", "src/constellation/explain.py", "src/constellation/preview.py", "src/constellation/expansion.py", "src/constellation/scan_graph.py", "src/constellation/checkpoint.py", "src/constellation/hook_safety.py", "src/constellation/conflicts.py", "src/constellation/triggers.py", "src/constellation/verdict.py", "src/constellation/habits.py", "src/constellation/assessment.py", "src/constellation/pins.py", "src/constellation/weekly.py", "src/constellation/cli_reports.py", "src/constellation/menu.py", "src/constellation/selfcheck.py", "src/constellation/cli_help.py", "src/constellation/completion.py", "src/constellation/skill_search.py"]
pytest_add_cli_args_test_selection = ["tests"]
also_copy = ["docs/design"]  # the lens route tests read the demo fixtures

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["fastembed", "anthropic"]
ignore_missing_imports = true
