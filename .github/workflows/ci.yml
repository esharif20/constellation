name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --extra app --extra llm
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      # Mutation gate for the redaction guard: every mutant must be killed (about 10 seconds).
      - run: |
          uv run mutmut run
          survivors="$(uv run mutmut results)"
          if [ -n "$survivors" ]; then echo "$survivors"; exit 1; fi
