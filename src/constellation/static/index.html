<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="graph" aria-label="Constellation graph"></canvas>
<header id="hud"><b>Constellation</b><span id="stats"></span></header>
<aside id="inspector" hidden>
  <button id="close" aria-label="Close inspector">&times;</button>
  <p id="i-kind"></p>
  <h2 id="i-name"></h2>
  <p id="i-label"></p>
  <dl>
    <dt>Cluster</dt><dd id="i-cluster"></dd>
    <dt>Source</dt><dd id="i-source"></dd>
    <dt>Description</dt><dd id="i-desc"></dd>
    <dt>Relations</dt><dd><ul id="i-rel"></ul></dd>
  </dl>
</aside>
<footer id="legend" aria-label="Colour by kind"></footer>
<p id="msg" hidden></p>
<script src="d3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
